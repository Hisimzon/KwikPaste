name: Extension Release

# 扩展只传七牛并登记后台草稿，绝不创建 GitHub release。
"on":
  push:
    tags: ["ext-*-v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "扩展标签，例如 ext-ppocr-v1.0.0"
        required: true
        default: ext-ocr-v1.0.0
        type: string
      dry_run:
        description: "一次性密钥签名，不上传七牛、不登记后台"
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.extension.outputs.id }}
      ids: ${{ steps.extension.outputs.ids }}
      version: ${{ steps.extension.outputs.version }}
      protocol: ${{ steps.extension.outputs.protocol }}
      dry_run: ${{ steps.extension.outputs.dry_run }}
      matrix: ${{ steps.extension.outputs.matrix }}
      targets: ${{ steps.extension.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension tag and protocol
        id: extension
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tomllib
          push = os.environ["GITHUB_EVENT_NAME"] == "push"
          tag = os.environ["GITHUB_REF_NAME"] if push else os.environ["INPUT_TAG"]
          dry_run = not push and os.environ["INPUT_DRY_RUN"] == "true"
          match = re.fullmatch(r"ext-([a-z][a-z0-9-]*)-v(.+)", tag)
          if not match:
              raise SystemExit("Invalid extension tag")
          id, version = match.groups()
          # 版本必须与 Cargo.toml 一致，semver 合法性由 cargo 保证。
          if not dry_run and os.environ["GITHUB_REF"] != f"refs/tags/{tag}":
              raise SystemExit("Real publication must run on the matching tag ref")
          ppocr = id == "ppocr"
          if id not in {"ocr", "wetype"} and not ppocr:
              raise SystemExit("Unknown extension")
          ids = ["ocr-tiny", "ocr-small", "ocr-medium"] if ppocr else [id]
          manifest = "extensions/ppocr/Cargo.toml" if ppocr else "extensions/wetype/Cargo.toml" if id == "wetype" else f"crates/kwikpaste-ext-{id}/Cargo.toml"
          package = tomllib.loads(pathlib.Path(manifest).read_text(encoding="utf-8"))["package"]
          expected_package = "kwikpaste-ext-ppocr" if ppocr else f"kwikpaste-ext-{id}"
          if package["name"] != expected_package or package["version"] != version:
              raise SystemExit("Tag and extension Cargo.toml do not match")
          protocol_source = pathlib.Path("crates/kwikpaste-ext-protocol/src/lib.rs").read_text(encoding="utf-8")
          protocol_id = "ocr" if ppocr else id
          protocols = re.findall(rf"^pub const {protocol_id.upper()}_PROTOCOL: u32 = ([0-9]+);$", protocol_source, re.M)
          if len(protocols) != 1 or int(protocols[0]) < 1:
              raise SystemExit("Missing or invalid extension protocol constant")
          matrix = [
              dict(os="macos-latest", triple="aarch64-apple-darwin", target="darwin-aarch64"),
              dict(os="macos-latest", triple="x86_64-apple-darwin", target="darwin-x86_64"),
              dict(os="windows-latest", triple="x86_64-pc-windows-msvc", target="windows-x86_64"),
              dict(os="windows-latest", triple="aarch64-pc-windows-msvc", target="windows-aarch64"),
          ]
          if ppocr:
              matrix = [item for item in matrix if item["target"] == "windows-x86_64"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ids=" + json.dumps(ids) + "\n")
              output.write("matrix=" + json.dumps({"include": matrix}) + "\n")
              output.write("targets=" + json.dumps([item["target"] for item in matrix]) + "\n")
              output.write(f"id={id}\nversion={version}\nprotocol={protocols[0]}\ndry_run={str(dry_run).lower()}\n")
          PY
      - uses: pnpm/action-setup@v6
        if: steps.extension.outputs.dry_run == 'true'
      - uses: actions/setup-node@v6
        if: steps.extension.outputs.dry_run == 'true'
        with:
          node-version: 24
          cache: pnpm
      # 与 native-release 相同，口令非空，四个目标共用一次性密钥。
      - name: Generate throwaway signing key
        if: steps.extension.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p dry-run-key
          password="dry-run-$(openssl rand -hex 16)"
          pnpm tauri signer generate --ci -p "${password}" -w dry-run-key/dry-run.key -f > /dev/null
          printf '%s' "${password}" > dry-run-key/password.txt
      - uses: actions/upload-artifact@v4
        if: steps.extension.outputs.dry_run == 'true'
        with:
          name: ext-dry-run-key
          path: dry-run-key
          retention-days: 1

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      EXT_ID: ${{ needs.prepare.outputs.id }}
      EXT_IDS: ${{ needs.prepare.outputs.ids }}
      VERSION: ${{ needs.prepare.outputs.version }}
      EXT_TARGET: ${{ matrix.target }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.triple }}
      # 带令牌才不会撞上匿名 API 限流；MSVC 由 rustc 和 openssl-src 自己查注册表找到，
      # 不用 msvc-dev-cmd（它和 bash 里 Git 自带的 link.exe 冲突）。
      - uses: arduino/setup-protoc@v3
        if: needs.prepare.outputs.id == 'wetype'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup NASM and Strawberry Perl
        if: runner.os == 'Windows' && needs.prepare.outputs.id == 'wetype'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
          # bash 里 Git 自带的 MSYS perl 排在前面，编不了 MSVC 版 OpenSSL。
          'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: extension-release-${{ needs.prepare.outputs.id }}-${{ matrix.triple }}
          workspaces: ${{ needs.prepare.outputs.id == 'ppocr' && 'extensions/ppocr' || needs.prepare.outputs.id == 'wetype' && 'extensions/wetype' || '.' }}
      - uses: actions/setup-python@v6
        if: needs.prepare.outputs.id == 'ppocr'
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        if: needs.prepare.outputs.id == 'ppocr'
        with:
          arch: x64
      - uses: actions/cache@v4
        if: needs.prepare.outputs.id == 'ppocr'
        with:
          path: |
            extensions/ppocr/.cache/ort-*
            extensions/ppocr/.cache/models
          key: ort-1.31.0-${{ matrix.triple }}-${{ hashFiles('extensions/ppocr/required_operators.config', 'extensions/ppocr/build_ort.py', 'extensions/ppocr/models.json') }}
      - name: Build cached static CPU ONNX Runtime
        if: needs.prepare.outputs.id == 'ppocr'
        shell: pwsh
        run: |
          python -m pip install -r extensions/ppocr/requirements-build.txt
          python extensions/ppocr/fetch_models.py
          python extensions/ppocr/build_ort.py --target "${{ matrix.triple }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Tauri CLI
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build PP-OCR extension
        if: needs.prepare.outputs.id == 'ppocr'
        shell: pwsh
        working-directory: extensions/ppocr
        run: cargo build --locked --release --bin kwikpaste-ext-ocr-tiny --bin kwikpaste-ext-ocr-small --bin kwikpaste-ext-ocr-medium --target "${{ matrix.triple }}"
      - name: Build extension
        if: needs.prepare.outputs.id != 'ppocr'
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          set -euo pipefail
          if [[ "${EXT_ID}" == wetype ]]; then
            cargo build --locked --release --manifest-path extensions/wetype/Cargo.toml --target "${TRIPLE}"
          else
            cargo build --locked --release -p "kwikpaste-ext-${EXT_ID}" --target "${TRIPLE}"
          fi
      - name: Name and check binary
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${RUNNER_OS}" == Windows ]]; then suffix=".exe"; fi
          mkdir -p dist
          root=target
          if [[ "${EXT_ID}" == wetype ]]; then root=extensions/wetype/target; fi
          if [[ "${EXT_ID}" == ppocr ]]; then root=extensions/ppocr/target; fi
          for id in $(jq -r '.[]' <<< "${EXT_IDS}"); do
            name="KwikPaste-ext-${id}_${VERSION}_${EXT_TARGET}${suffix}"
            cp "${root}/${TRIPLE}/release/kwikpaste-ext-${id}${suffix}" "dist/${name}"
            # 交叉编译的 x86_64 没有链接器的 ad-hoc 签名；统一补签，必须在 minisign 之前。
            if [[ "${RUNNER_OS}" == macOS ]]; then
              codesign --force --sign - "dist/${name}"
              codesign -v "dist/${name}"
            fi
          done
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.dry_run == 'true'
        with:
          name: ext-dry-run-key
          path: ${{ runner.temp }}/dry-run-key
      - name: Sign (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "${RUNNER_TEMP}/dry-run-key/dry-run.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(cat "${RUNNER_TEMP}/dry-run-key/password.txt")"
          node --input-type=module - <<'JS'
          import { spawnSync } from 'node:child_process';
          import { tauriCli } from './scripts/release/package-native.mjs';
          for (const id of JSON.parse(process.env.EXT_IDS)) {
            const binary = `dist/KwikPaste-ext-${id}_${process.env.VERSION}_${process.env.EXT_TARGET}${process.env.RUNNER_OS === 'Windows' ? '.exe' : ''}`;
            const result = spawnSync(process.execPath, [tauriCli(), 'signer', 'sign', binary], { stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          JS
      - name: Sign
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node --input-type=module - <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { tauriCli } from './scripts/release/package-native.mjs';
          const key = process.env.TAURI_SIGNING_PRIVATE_KEY;
          if (!key) throw new Error('Missing release signing key');
          if (existsSync(key)) process.env.TAURI_SIGNING_PRIVATE_KEY = readFileSync(key, 'utf8').trim();
          for (const id of JSON.parse(process.env.EXT_IDS)) {
            const binary = `dist/KwikPaste-ext-${id}_${process.env.VERSION}_${process.env.EXT_TARGET}${process.env.RUNNER_OS === 'Windows' ? '.exe' : ''}`;
            const result = spawnSync(process.execPath, [tauriCli(), 'signer', 'sign', binary], { stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          JS
      - name: Verify signed binary
        shell: bash
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { parsePublicKey, verifySignature } from './scripts/ci/lib/minisign.mjs';
          const keyPath = process.env.DRY_RUN === 'true'
            ? join(process.env.RUNNER_TEMP, 'dry-run-key', 'dry-run.key.pub')
            : 'crates/kwikpaste-updater/pubkey.txt';
          for (const id of JSON.parse(process.env.EXT_IDS)) {
            const binary = `dist/KwikPaste-ext-${id}_${process.env.VERSION}_${process.env.EXT_TARGET}${process.env.RUNNER_OS === 'Windows' ? '.exe' : ''}`;
            verifySignature(readFileSync(binary), readFileSync(`${binary}.sig`, 'utf8'), parsePublicKey(readFileSync(keyPath, 'utf8')));
          }
          console.log('Extension signature verified');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      EXT_IDS: ${{ needs.prepare.outputs.ids }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROTOCOL: ${{ needs.prepare.outputs.protocol }}
      EXT_TARGETS: ${{ needs.prepare.outputs.targets }}
      MIRROR_BUCKET: kwikpaste
      MIRROR_S3_ENDPOINT: https://s3.cn-south-1.qiniucs.com
      AWS_DEFAULT_REGION: cn-south-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: ext-*
          path: dist
          merge-multiple: true
      - name: Assemble registration
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, statSync, writeFileSync, readdirSync } from 'node:fs';
          const { VERSION: version, PROTOCOL: protocol, GITHUB_SHA: commit } = process.env;
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Invalid commit SHA');
          const targets = JSON.parse(process.env.EXT_TARGETS);
          const ids = JSON.parse(process.env.EXT_IDS);
          if (readdirSync('dist').length !== ids.length * targets.length * 2) throw new Error('Unexpected binaries or signatures');
          for (const id of ids) {
            const files = {};
            for (const target of targets) {
              const name = `KwikPaste-ext-${id}_${version}_${target}${target.startsWith('windows-') ? '.exe' : ''}`;
              const size = statSync(`dist/${name}`).size;
              const signature = readFileSync(`dist/${name}.sig`, 'utf8').trim();
              if (!size || size > 256 * 1024 * 1024 || !signature) throw new Error(`Invalid artifact ${name}`);
              files[target] = { name, size, signature };
            }
            writeFileSync(`registration-${id}.json`, JSON.stringify({ id, version, protocol: Number(protocol), commit, files }));
          }
          JS
      - name: Upload binaries to Qiniu and verify mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.QINIU_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID}" && test -n "${AWS_SECRET_ACCESS_KEY}"
          for id in $(jq -r '.[]' <<< "${EXT_IDS}"); do
            prefix="kwikpaste/ext/${id}/${VERSION}"
            aws s3 --endpoint-url "${MIRROR_S3_ENDPOINT}" --only-show-errors cp dist/ "s3://${MIRROR_BUCKET}/${prefix}/" --recursive --exclude '*' --include "KwikPaste-ext-${id}_${VERSION}_*"
            name="$(jq -r '.files["windows-x86_64"].name' "registration-${id}.json")"
            curl --fail --show-error --location --retry 3 --retry-delay 5 "https://dl.fastthree.com/${prefix}/${name}" -o mirrored.exe
            cmp "dist/${name}" mirrored.exe
          done
      - name: Register backend draft
        env:
          KWIKPASTE_EXT_CI_TOKEN: ${{ secrets.KWIKPASTE_EXT_CI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KWIKPASTE_EXT_CI_TOKEN}"
          for id in $(jq -r '.[]' <<< "${EXT_IDS}"); do
            curl --fail-with-body --show-error --silent \
              -H "Authorization: Bearer ${KWIKPASTE_EXT_CI_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary "@registration-${id}.json" \
              https://paste.fastthree.com/api/v1/admin/extension-builds
          done
