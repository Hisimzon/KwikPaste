name: Native CI

# 原生 2.0（GPUI，根 workspace 的 crates/）的检查、构建和冒烟自测。
#
#   check  Windows x64：vendored GPUI 与“原版 + 补丁”逐字节一致、补丁版确实被用上、4 个发布目标都没有
#          rustls / ring、UI 分层与颜色 token 守卫、fmt、clippy、测试，以及更新器在 e2e-overrides 特性下的 clippy 与测试。
#   core-macos  macOS 上跑 kwikpaste-core、kwikpaste-os、kwikpaste-updater 的测试：迁移校验和在 macOS 是 LF 那一侧；
#               os 的应用包扫描、NSSound 解码提示音和更新器的换包代码只在 macOS 上编译，本机没有 Mac。
#   build  4 个发布目标的 release 构建，配置与以后发布一致（Windows 静态 CRT，macOS 最低 10.15）。
#   smoke  在 4 个目标上真正启动应用：`--selftest-smoke` 打开窗口、几秒后正常退出，看退出码。
#          GitHub 的 Windows 机器没有显卡，走的是 WARP 软件渲染；macOS Intel 在 Apple Silicon 上经 Rosetta 运行。
#          Windows x64 另跑 tools/platform-probes/panel-invariants.ps1：面板窗口样式、MA_NOACTIVATE、
#          显示位置、最小尺寸、不抢前台。它不注入键鼠，只要有桌面会话。
#
# 1.x 的 Tauri 版（src/、src-tauri/）不在这里检查，见 pr-check.yml 和 release.yml。

"on":
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "third_party/**"
      - "scripts/gpui/**"
      - "scripts/ci/**"
      - "tools/platform-probes/**"
      - "src-tauri/migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/native-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "crates/**"
      - "third_party/**"
      - "scripts/gpui/**"
      - "scripts/ci/**"
      - "tools/platform-probes/**"
      - "src-tauri/migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Vendored GPUI matches upstream plus patches
        shell: bash
        run: node scripts/gpui/vendor.mjs gpui-pre-windows --check

      # 2.0 打开 1.x 的数据库：core 的迁移文件必须与 src-tauri 已发布的逐字节一致（git blob、检出字节、换行属性）。
      - name: Core migrations match the released ones
        shell: bash
        run: node scripts/ci/check-migration-parity.mjs

      # 只有 kwikpaste-ui 能用 gpui-component / gpui-base；theme 目录以外不得出现颜色字面量。
      - name: UI layering and color tokens
        shell: bash
        run: node scripts/ci/check-ui-boundaries.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: native-check

      - name: Format
        shell: bash
        run: cargo fmt --check

      # TLS 走系统实现：rustls 加 ring 会让安装包大约 1 MB，一个依赖的默认特性就能把它带进来。
      - name: No rustls or ring on release targets
        shell: bash
        run: node scripts/ci/check-forbidden-deps.mjs

      - name: Vendored GPUI is in use
        shell: bash
        run: |
          set -euo pipefail

          # 版本对不上时 [patch] 只给一条警告、退出码仍是 0，构建会悄悄换回 crates.io 上没打补丁的版本。
          source="$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "gpui-pre-windows") | .source')"
          if [[ "${source}" != "null" ]]; then
            echo "::error::gpui-pre-windows resolves to ${source}, not third_party/gpui."
            exit 1
          fi

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail

          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
          if grep -q "was not used in the crate graph" clippy.log; then
            echo "::error::A [patch.crates-io] entry was not used."
            exit 1
          fi

      - name: Test
        shell: bash
        run: cargo test --locked --workspace

      # e2e-overrides 只在端到端测试的构建里开，发布产物不开；这里确认它编得过、测得过。
      - name: Updater with e2e overrides
        shell: bash
        run: |
          set -euo pipefail

          cargo clippy --locked -p kwikpaste-updater --all-targets --features e2e-overrides -- -D warnings
          cargo test --locked -p kwikpaste-updater --features e2e-overrides

  core-macos:
    name: Core, OS and updater tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: native-core-macos

      - name: Test
        run: cargo test --locked -p kwikpaste-core -p kwikpaste-os -p kwikpaste-updater

      - name: Updater clippy
        run: cargo clippy --locked -p kwikpaste-updater --no-deps --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}

      # link.exe、cl.exe、fxc.exe 都没有 longPathAware；最深的产物在检出目录下约 113 个字符处。
      - name: Path length guard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $length = $env:GITHUB_WORKSPACE.Length
          if ($length -gt 100) { throw "Checkout path '$env:GITHUB_WORKSPACE' is $length characters; the build needs it at most 100." }

      # gpui-pre-windows 的 build.rs 在 release 下用 fxc 编译 HLSL；自己查找时按宿主架构取 SDK，ARM64 交叉编译会找错，这里显式指定 x64 版。
      - name: Pin fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0').InstallationFolder
          $version = Get-ChildItem "$sdk\bin" -Directory | Where-Object Name -match '^10\.' |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $fxc = Join-Path $version.FullName 'x64\fxc.exe'
          if (-not (Test-Path $fxc)) { throw "fxc.exe not found at $fxc" }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        env:
          # 静态 CRT：便携版只有一个 exe，不能依赖 VC++ 运行库。只经 --target 生效，不影响 build script 和过程宏。
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --locked --release -p kwikpaste-app --target ${{ matrix.target }}

      - name: Check Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/KwikPaste.exe"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $dependents = & $dumpbin.FullName /dependents $exe
          $dependents
          if ($dependents -match 'VCRUNTIME140|api-ms-win-crt-') { throw 'The exe imports the VC++ runtime: +crt-static is missing.' }
          "size: $((Get-Item $exe).Length) bytes"

      - name: Check macOS binary
        if: runner.os == 'macOS'
        run: |
          bin="target/${{ matrix.target }}/release/KwikPaste"
          lipo -archs "${bin}"
          otool -l "${bin}" | grep -A4 LC_BUILD_VERSION
          echo "size: $(stat -f %z "${bin}") bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KwikPaste-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/KwikPaste${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.label }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel (Rosetta)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: KwikPaste-${{ matrix.target }}

      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KWIKPASTE_SELFTEST = '1'
          $process = Start-Process ./KwikPaste.exe -ArgumentList '--selftest-smoke' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'KwikPaste did not exit within 60 s.' }
          if ($process.ExitCode -ne 0) { throw "KwikPaste exited with $($process.ExitCode)." }
          'KwikPaste started and exited cleanly.'

      - name: Checkout probe scripts
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: tools/platform-probes

      # 脚本按 Windows PowerShell 5.1 写（Add-Type 编译探针的 C#）。runner 的屏幕约 1024×768、96 DPI。
      - name: Panel invariants on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File source/tools/platform-probes/panel-invariants.ps1 -Exe ./KwikPaste.exe -Rounds 20

      - name: Upload panel probe results
        if: failure() && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: panel-invariants-${{ matrix.target }}
          path: source/tools/platform-probes/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test on macOS
        if: runner.os == 'macOS'
        run: |
          chmod +x KwikPaste
          KWIKPASTE_SELFTEST=1 ./KwikPaste --selftest-smoke &
          pid=$!
          for _ in $(seq 1 60); do
            if ! kill -0 "${pid}" 2> /dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "${pid}" 2> /dev/null; then
            kill "${pid}"
            echo "::error::KwikPaste did not exit within 60 s."
            exit 1
          fi
          wait "${pid}"
          echo "KwikPaste started and exited cleanly."
