[package]
name = "kwikpaste-core"
description = "KwikPaste's data contracts and business logic, free of Tauri and GPUI."
version.workspace = true
# 代码从 1.x 的 src-tauri（edition 2021）复制而来，两份要并存到 1.x 停止维护。保持 2021：
# rustfmt 风格、if let / 尾表达式临时值的析构时机都与 src-tauri 一致，1.x 的修复能按 diff 原样移植。
edition = "2021"
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
dirs.workspace = true
log.workspace = true
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
unicode-segmentation.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
uuid.workspace = true

[lints]
workspace = true
