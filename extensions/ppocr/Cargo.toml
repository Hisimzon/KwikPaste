# Isolated from the application workspace: ORT/model builds are explicit only.
[workspace]

[package]
name = "kwikpaste-ext-ppocr"
version = "1.0.0"
edition = "2024"
authors = ["LILTT"]
license = "Apache-2.0"
publish = false

[[bin]]
name = "kwikpaste-ext-ocr-tiny"
path = "src/bin/tiny.rs"

[[bin]]
name = "kwikpaste-ext-ocr-small"
path = "src/bin/small.rs"

[[bin]]
name = "kwikpaste-ext-ocr-medium"
path = "src/bin/medium.rs"

[dependencies]
anyhow = "1"
kwikpaste-ext-protocol = { path = "../../crates/kwikpaste-ext-protocol" }
# Keep the exact prerelease API validated by the prototype and this ORT source pin.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-24"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
clipper2 = "0.5"
serde_yaml = "0.9"
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
